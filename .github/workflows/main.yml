name: A workflow for my Hello World App

on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin 26.0.2
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup network
        run: |
          docker network create --driver bridge se-methods
          docker pull mongo
          docker run -d --name mongo-dbserver --network se-methods mongo

      - name: Build with Maven
        run: mvn package

      - name: Build Docker Image
        run: docker build -t devopsimage .

      - name: Run image
        run: docker run --network se-methods --name devopscontainer devopsimage

      - name: View logs
        run: docker logs devopscontainer
